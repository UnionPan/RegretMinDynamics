[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["algorithms", "games", "research", "ui", "plotting", "api", "app", "main", "rps_experiments"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]
